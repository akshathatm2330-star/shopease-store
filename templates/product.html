{% extends "base.html" %}
{% block title %}{{ product['name'] }} - ShopEase{% endblock %}
{% block content %}
<div class="product-detail">
  <div class="detail-image"><img src="{{ url_for('static', filename='images/' + product['image']) }}" alt="{{ product['name'] }}"></div>
  <div class="detail-info">
    <div class="rating">⭐ {{ product['rating'] }} ({{ product['reviews'] }} reviews)</div>
    <h1>{{ product['name'] }}</h1>
    <div class="price big">₹{{ "{:,.0f}".format(product['price']) }}</div>
    <p>{{ product['description'] }}</p>
    <div class="detail-actions">
      <form method="post" action="{{ url_for('cart_add', product_id=product['id']) }}">
        <button class="btn primary" type="submit">🛒 Add to Cart</button>
      </form>
      <button class="btn pink heart" data-product="{{ product['id'] }}">♥ Wishlist</button>
    </div>
  </div>
</div>
{% endblock %}
